[package]
name = "local-code-editor"
version = "0.1.0"
description = "Local-First Desktop Code Editor"
authors = ["manrajchauhan"]
edition = "2021"

[lib]
name = "local_code_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
